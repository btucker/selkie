<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="788" height="500" viewBox="0 0 788 500" class="mermaid">
  <style>

.c4-element-group {
  cursor: pointer;
}

.c4-element, .c4-person-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-person-head {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-db-top, .c4-db-body, .c4-db-bottom {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-queue {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-boundary {
  fill: none;
}

.c4-label, .c4-technology, .c4-description {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-boundary-label {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-rel-label, .c4-rel-technology {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-relationship {
  stroke-linecap: round;
}

  </style>
  <defs>
    <marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
</marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <text x="394" y="25" class="c4-title" text-anchor="middle" fill="#333333" font-size="20" font-weight="bold">System Context diagram for Internet Banking System</text>
    <g class="c4-boundary-group" id="b0">
      <rect x="256" y="210" width="492" height="250" rx="2.5" ry="2.5" class="c4-boundary" stroke-width="1" fill="none" stroke="#444444" stroke-dasharray="7,7"/>
      <text x="266" y="230" class="c4-boundary-label" font-weight="bold" fill="#444444" font-size="14">BankBoundary</text>
      <text x="266" y="245" class="c4-boundary-type" fill="#444444" font-size="12">[ENTERPRISE]</text>
    </g>
    <g class="c4-element-group" id="email">
      <rect x="20" y="20" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" fill="#999999" stroke-width="0.5" stroke="#7a7a7a"/>
      <text x="128" y="38" class="c4-type" fill="#ffffff" text-anchor="middle" font-size="11" font-style="italic">&lt;&lt;external_system&gt;&gt;</text>
      <text x="128" y="54" class="c4-label" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">E-mail System</text>
      <text x="128" y="76" class="c4-description" text-anchor="middle" fill="#ffffff" font-size="11">External e-mail system</text>
    </g>
    <g class="c4-element-group" id="customer">
      <rect x="276" y="260" width="216" height="180" rx="2.5" ry="2.5" class="c4-element" fill="#08427b" stroke="#073b6f" stroke-width="0.5"/>
      <text x="384" y="278" class="c4-type" fill="#ffffff" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;person&gt;&gt;</text>
      <circle cx="384" cy="310" r="10" class="c4-person-icon-head" fill="#ffffff"/>
      <path d="M384,320 l-15,25 l30,0 z" class="c4-person-icon-body" fill="#ffffff"/>
      <text x="384" y="344" class="c4-label" fill="#ffffff" text-anchor="middle" font-weight="bold" font-size="14">Banking Customer</text>
      <text x="384" y="366" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">A customer of the bank</text>
    </g>
    <g class="c4-element-group" id="banking">
      <rect x="512" y="260" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" stroke="#0e5a9d" fill="#1168bd" stroke-width="0.5"/>
      <text x="620" y="278" class="c4-type" font-size="11" fill="#ffffff" text-anchor="middle" font-style="italic">&lt;&lt;system&gt;&gt;</text>
      <text x="620" y="294" class="c4-label" font-weight="bold" text-anchor="middle" font-size="14" fill="#ffffff">Internet Banking System</text>
      <text x="620" y="316" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">Allows customers to view accounts</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 492 343.135593220339 L 512 341.864406779661" class="c4-relationship" fill="none" stroke-width="1" marker-end="url(#c4-arrow)" stroke="#666666"/>
      <rect x="483" y="332.5" width="38" height="20" rx="3" ry="3" class="c4-rel-label-bg" fill="#ffffff" stroke="#666666" stroke-width="0.5"/>
      <text x="502" y="346.5" class="c4-rel-label" font-size="11" fill="#666666" text-anchor="middle">Uses</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 512 282.3170731707317 L 236 147.6829268292683" class="c4-relationship" stroke="#666666" stroke-width="1" marker-end="url(#c4-arrow)" fill="none"/>
      <rect x="323.5" y="205" width="101" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke="#666666" stroke-width="0.5" fill="#ffffff"/>
      <text x="374" y="219" class="c4-rel-label" text-anchor="middle" fill="#666666" font-size="11">Sends e-mails</text>
      <text x="374" y="230" class="c4-rel-technology" font-style="italic" font-size="10" text-anchor="middle" fill="#666666">[SMTP]</text>
    </g>
  </g>
</svg>
