<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="788" height="500" viewBox="0 0 788 500" class="mermaid">
  <style>

.c4-element-group {
  cursor: pointer;
}

.c4-element, .c4-person-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-person-head {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-db-top, .c4-db-body, .c4-db-bottom {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-queue {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-boundary {
  fill: none;
}

.c4-label, .c4-technology, .c4-description {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-boundary-label {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-rel-label, .c4-rel-technology {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-relationship {
  stroke-linecap: round;
}

  </style>
  <defs>
    <marker id="c4-arrow" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
</marker>
    <marker id="c4-arrow-reverse" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M 10 0 L 0 5 L 10 10 z" fill="#666666"/>
</marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <text x="394" y="25" class="c4-title" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">System Context diagram for Internet Banking System</text>
    <g class="c4-boundary-group" id="b0">
      <rect x="256" y="210" width="492" height="250" rx="2.5" ry="2.5" class="c4-boundary" fill="none" stroke-width="1" stroke-dasharray="7,7" stroke="#444444"/>
      <text x="266" y="230" class="c4-boundary-label" font-weight="bold" font-size="14" fill="#444444">BankBoundary</text>
      <text x="266" y="245" class="c4-boundary-type" fill="#444444" font-size="12">[ENTERPRISE]</text>
    </g>
    <g class="c4-element-group" id="email">
      <rect x="20" y="20" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" fill="#999999" stroke="#7a7a7a" stroke-width="0.5"/>
      <text x="128" y="38" class="c4-type" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">&lt;&lt;external_system&gt;&gt;</text>
      <text x="128" y="54" class="c4-label" font-weight="bold" fill="#ffffff" text-anchor="middle" font-size="14">E-mail System</text>
      <text x="128" y="76" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">External e-mail system</text>
    </g>
    <g class="c4-element-group" id="customer">
      <rect x="276" y="260" width="216" height="180" rx="2.5" ry="2.5" class="c4-element" stroke-width="0.5" fill="#08427b" stroke="#073b6f"/>
      <circle cx="384" cy="310" r="10" class="c4-person-icon-head" fill="#ffffff"/>
      <path d="M384,320 l-15,25 l30,0 z" class="c4-person-icon-body" fill="#ffffff"/>
      <text x="384" y="278" class="c4-type" font-style="italic" text-anchor="middle" fill="#ffffff" font-size="11">&lt;&lt;person&gt;&gt;</text>
      <text x="384" y="344" class="c4-label" font-weight="bold" text-anchor="middle" font-size="14" fill="#ffffff">Banking Customer</text>
      <text x="384" y="366" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">A customer of the bank</text>
    </g>
    <g class="c4-element-group" id="banking">
      <rect x="512" y="260" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" stroke="#0e5a9d" stroke-width="0.5" fill="#1168bd"/>
      <text x="620" y="278" class="c4-type" font-style="italic" fill="#ffffff" text-anchor="middle" font-size="11">&lt;&lt;system&gt;&gt;</text>
      <text x="620" y="294" class="c4-label" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">Internet Banking System</text>
      <text x="620" y="316" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">Allows customers to view accounts</text>
    </g>
    <g class="c4-relationship-group">
      <line x1="492" y1="343.135593220339" x2="512" y2="341.864406779661" class="c4-relationship" stroke="#666666" marker-end="url(#c4-arrow)" stroke-width="1"/>
      <text x="502" y="346.5" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="12">Uses</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M512,282.3170731707317 Q443,215 236,147.6829268292683" class="c4-relationship" stroke="#666666" fill="none" stroke-width="1" marker-end="url(#c4-arrow)"/>
      <text x="374" y="219" class="c4-rel-label" font-size="12" fill="#666666" text-anchor="middle">Sends e-mails</text>
      <text x="374" y="232" class="c4-rel-technology" fill="#666666" font-size="12" text-anchor="middle" font-style="italic">[SMTP]</text>
    </g>
  </g>
</svg>
