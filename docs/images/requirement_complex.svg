  stroke: #333333;
  stroke-width: 1.5;
}

.relationship-label {
  fill: #333333;
}

.relationship-label-bg {
  fill: #ffffff;
  stroke: #9370DB;
  stroke-width: 0.5;
}

.marker {
  fill: #333333;
  stroke: none;
}

