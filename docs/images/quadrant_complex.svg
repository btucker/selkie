    <circle cx="376" cy="188" r="5" class="quadrant-point" fill="#ff9900"/>
    <text x="376" y="178" class="quadrant-point-label" text-anchor="middle" dominant-baseline="auto" font-size="12" fill="#333333">Amazon</text>
    <circle cx="342.4" cy="220" r="5" class="quadrant-point" fill="#4285f4"/>
    <text x="342.4" y="210" class="quadrant-point-label" font-size="12" fill="#333333" text-anchor="middle" dominant-baseline="auto">Google</text>
  </g>
</svg>
