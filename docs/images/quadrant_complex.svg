<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" class="mermaid">
  <style>

.mermaid {
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.node rect,
.node polygon,
.node circle,
.node ellipse,
.node path {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1px;
}

.node line {
  stroke: #9370DB;
  stroke-width: 1px;
}

.node .label {
  fill: #333333;
}

.node text {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.edge-path {
  fill: none;
  stroke: #333333;
  stroke-width: 1px;
}

.edge-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.edge-label-bg {
  fill: rgba(232, 232, 232, 0.8);
}

.subgraph {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
}

.subgraph-title {
  fill: #333333;
  font-weight: bold;
}

.cluster rect {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
  rx: 5px;
  ry: 5px;
}

.cluster-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
}

marker path {
  fill: #333333;
  stroke: #333333;
}


.quadrant-background {
  fill: #ffffff;
}

.quadrant-title {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.quadrant {
  stroke: none;
}

.quadrant-border {
  stroke: #9370DB;
  stroke-width: 1px;
}

.quadrant-outer-border {
  fill: none;
  stroke: #9370DB;
  stroke-width: 2px;
}

.quadrant-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.axis-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.quadrant-point {
  stroke-width: 0;
}

.quadrant-point-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

  </style>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <rect x="0" y="0" width="500" height="500" class="quadrant-background" fill="#ffffff"/>
    <text x="250" y="35" class="quadrant-title" font-size="20" font-weight="bold" dominant-baseline="middle" fill="#333333" text-anchor="middle">Analytics and Business Intelligence Platforms</text>
    <rect x="40" y="60" width="210" height="200" class="quadrant quadrant-2" fill="#e0e0e0"/>
    <rect x="250" y="60" width="210" height="200" class="quadrant quadrant-1" fill="#f0f0f0"/>
    <rect x="40" y="260" width="210" height="200" class="quadrant quadrant-3" fill="#e0e0e0"/>
    <rect x="250" y="260" width="210" height="200" class="quadrant quadrant-4" fill="#f0f0f0"/>
    <line x1="250" y1="60" x2="250" y2="460" class="quadrant-border" stroke-width="1" stroke="#9370DB"/>
    <line x1="40" y1="260" x2="460" y2="260" class="quadrant-border" stroke-width="1" stroke="#9370DB"/>
    <rect x="40" y="60" width="420" height="400" class="quadrant-outer-border" stroke="#9370DB" fill="none" stroke-width="2"/>
    <text x="355" y="160" class="quadrant-label" fill="#333333" dominant-baseline="middle" text-anchor="middle" font-size="16">Leaders</text>
    <text x="145" y="160" class="quadrant-label" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#333333">Challengers</text>
