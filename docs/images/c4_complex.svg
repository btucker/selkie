<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1496" height="500" viewBox="0 0 1496 500" class="mermaid">
  <style>

.c4-element-group {
  cursor: pointer;
}

.c4-element, .c4-person-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-person-head {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-db-top, .c4-db-body, .c4-db-bottom {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-queue {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-boundary {
  fill: none;
}

.c4-label, .c4-technology, .c4-description {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-boundary-label {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-rel-label, .c4-rel-technology {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-relationship {
  stroke-linecap: round;
}

  </style>
  <defs>
    <marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
</marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <g class="c4-boundary-group" id="c1">
      <rect x="492" y="240" width="964" height="220" rx="2.5" ry="2.5" class="c4-boundary" stroke="#444444" stroke-width="1" fill="none" stroke-dasharray="7,7"/>
      <text x="502" y="260" class="c4-boundary-label" fill="#444444" font-weight="bold" font-size="14">Internet Banking</text>
    </g>
    <g class="c4-element-group" id="email_system">
      <rect x="20" y="20" width="216" height="150" rx="5" ry="5" class="c4-element" fill="#999999"/>
      <text x="128" y="45" class="c4-label" font-weight="bold" fill="#ffffff" font-size="14" text-anchor="middle">E-Mail System</text>
      <text x="128" y="71" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">The internal Microsoft</text>
      <text x="128" y="85" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">Exchange system</text>
    </g>
    <g class="c4-element-group" id="customer">
      <circle cx="364" cy="55" r="25" class="c4-person-head" fill="#08427b"/>
      <rect x="256" y="85" width="216" height="105" rx="5" ry="5" class="c4-person-body" fill="#08427b"/>
      <text x="364" y="100" class="c4-label" font-weight="bold" text-anchor="middle" font-size="14" fill="#ffffff">Customer</text>
      <text x="364" y="126" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">A customer of the bank, with</text>
      <text x="364" y="140" class="c4-description" text-anchor="middle" font-size="11" fill="#ffffff">personal bank accounts</text>
    </g>
    <g class="c4-element-group" id="spa">
      <rect x="512" y="290" width="216" height="150" rx="5" ry="5" class="c4-element" fill="#438dd5"/>
      <text x="620" y="315" class="c4-label" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Single-Page App</text>
      <text x="620" y="333" class="c4-technology" fill="#ffffff" font-style="italic" text-anchor="middle" font-size="11">[JavaScript, Angular]</text>
      <text x="620" y="357" class="c4-description" text-anchor="middle" fill="#ffffff" font-size="11">Provides all the Internet</text>
      <text x="620" y="371" class="c4-description" text-anchor="middle" font-size="11" fill="#ffffff">banking functionality</text>
    </g>
    <g class="c4-element-group" id="api">
      <rect x="748" y="290" width="216" height="150" rx="5" ry="5" class="c4-element" fill="#438dd5"/>
      <text x="856" y="315" class="c4-label" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">API Application</text>
      <text x="856" y="333" class="c4-technology" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">[Java, Spring MVC]</text>
      <text x="856" y="357" class="c4-description" text-anchor="middle" font-size="11" fill="#ffffff">Provides banking</text>
      <text x="856" y="371" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">functionality via JSON/HTTPS</text>
      <text x="856" y="385" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">API</text>
    </g>
    <g class="c4-element-group" id="db">
      <ellipse cx="1092" cy="302" rx="108" ry="12" class="c4-db-top" fill="#438dd5"/>
      <rect x="984" y="302" width="216" height="126" class="c4-db-body" fill="#438dd5"/>
      <ellipse cx="1092" cy="428" rx="108" ry="12" class="c4-db-bottom" fill="#438dd5"/>
      <text x="1092" y="325" class="c4-label" text-anchor="middle" font-weight="bold" font-size="14" fill="#ffffff">Database</text>
      <text x="1092" y="343" class="c4-technology" text-anchor="middle" font-style="italic" fill="#ffffff" font-size="11">[Oracle]</text>
      <text x="1092" y="367" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">Stores user data, accounts,</text>
      <text x="1092" y="381" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">transactions</text>
    </g>
    <g class="c4-element-group" id="queue">
      <rect x="1220" y="290" width="216" height="150" rx="50" ry="50" class="c4-queue" fill="#438dd5"/>
      <text x="1328" y="315" class="c4-label" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Message Broker</text>
      <text x="1328" y="333" class="c4-technology" font-size="11" text-anchor="middle" font-style="italic" fill="#ffffff">[RabbitMQ]</text>
      <text x="1328" y="357" class="c4-description" text-anchor="middle" fill="#ffffff" font-size="11">Handles async messaging</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 454.3529411764706 200 L 544.7058823529412 290" class="c4-relationship" marker-end="url(#c4-arrow)" stroke-width="1" stroke="#666666" fill="none"/>
      <rect x="480.5294117647059" y="235" width="38" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke="#666666" stroke-width="0.5" fill="#ffffff"/>
      <text x="499.5294117647059" y="249" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="11">Uses</text>
      <text x="499.5294117647059" y="260" class="c4-rel-technology" font-size="10" fill="#666666" font-style="italic" text-anchor="middle">[HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 728 365 L 748 365" class="c4-relationship" stroke-width="1" stroke="#666666" marker-end="url(#c4-arrow)" fill="none"/>
      <rect x="670" y="355" width="136" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke-width="0.5" fill="#ffffff" stroke="#666666"/>
      <text x="738" y="369" class="c4-rel-label" font-size="11" fill="#666666" text-anchor="middle">Makes API calls to</text>
      <text x="738" y="380" class="c4-rel-technology" fill="#666666" text-anchor="middle" font-style="italic" font-size="10">[JSON/HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 964 365 L 984 365" class="c4-relationship" stroke="#666666" fill="none" stroke-width="1" marker-end="url(#c4-arrow)"/>
      <rect x="899" y="355" width="150" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke-width="0.5" stroke="#666666" fill="#ffffff"/>
      <text x="974" y="369" class="c4-rel-label" text-anchor="middle" font-size="11" fill="#666666">Reads from and writes to</text>
      <text x="974" y="380" class="c4-rel-technology" font-style="italic" font-size="10" fill="#666666" text-anchor="middle">[JDBC]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 964 365 L 1220 365" class="c4-relationship" stroke-width="1" stroke="#666666" marker-end="url(#c4-arrow)" fill="none"/>
      <rect x="1027.5" y="355" width="129" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke="#666666" stroke-width="0.5" fill="#ffffff"/>
      <text x="1092" y="369" class="c4-rel-label" font-size="11" fill="#666666" text-anchor="middle">Sends messages to</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 236 101.86440677966101 L 256 103.13559322033899" class="c4-relationship" stroke="#666666" stroke-width="1" marker-end="url(#c4-arrow)" fill="none"/>
      <rect x="185" y="92.5" width="122" height="20" rx="3" ry="3" class="c4-rel-label-bg" fill="#ffffff" stroke="#666666" stroke-width="0.5"/>
      <text x="246" y="106.5" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="11">Sends e-mails to</text>
    </g>
  </g>
</svg>
