<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1496" height="500" viewBox="0 0 1496 500" class="mermaid">
  <style>

.c4-element-group {
  cursor: pointer;
}

.c4-element, .c4-person-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-person-head {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-db-top, .c4-db-body, .c4-db-bottom {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-queue {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-boundary {
  fill: none;
}

.c4-label, .c4-technology, .c4-description {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-boundary-label {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-rel-label, .c4-rel-technology {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-relationship {
  stroke-linecap: round;
}

  </style>
  <defs>
    <marker id="c4-arrow" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
</marker>
    <marker id="c4-arrow-reverse" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M 10 0 L 0 5 L 10 10 z" fill="#666666"/>
</marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <text x="748" y="25" class="c4-title" text-anchor="middle" fill="#333333" font-size="16" font-weight="bold">Container diagram for Internet Banking System</text>
    <g class="c4-boundary-group" id="c1">
      <rect x="492" y="240" width="964" height="220" rx="2.5" ry="2.5" class="c4-boundary" stroke="#444444" stroke-width="1" stroke-dasharray="7,7" fill="none"/>
      <text x="502" y="260" class="c4-boundary-label" font-weight="bold" font-size="14" fill="#444444">Internet Banking</text>
      <text x="502" y="275" class="c4-boundary-type" font-size="12" fill="#444444">[CONTAINER]</text>
    </g>
    <g class="c4-element-group" id="email_system">
      <rect x="20" y="20" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" fill="#999999" stroke="#7a7a7a" stroke-width="0.5"/>
      <text x="128" y="38" class="c4-type" font-size="11" fill="#ffffff" font-style="italic" text-anchor="middle">&lt;&lt;external_system&gt;&gt;</text>
      <text x="128" y="54" class="c4-label" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">E-Mail System</text>
      <text x="128" y="76" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">The internal Microsoft Exchange system</text>
    </g>
    <g class="c4-element-group" id="customer">
      <rect x="256" y="20" width="216" height="180" rx="2.5" ry="2.5" class="c4-element" stroke="#073b6f" stroke-width="0.5" fill="#08427b"/>
      <circle cx="364" cy="70" r="10" class="c4-person-icon-head" fill="#ffffff"/>
      <path d="M364,80 l-15,25 l30,0 z" class="c4-person-icon-body" fill="#ffffff"/>
      <text x="364" y="38" class="c4-type" font-size="11" text-anchor="middle" fill="#ffffff" font-style="italic">&lt;&lt;person&gt;&gt;</text>
      <text x="364" y="104" class="c4-label" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Customer</text>
      <text x="364" y="126" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">A customer of the bank, with personal bank accounts</text>
    </g>
    <g class="c4-element-group" id="spa">
      <rect x="512" y="290" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" stroke-width="0.5" stroke="#3879b8" fill="#438dd5"/>
      <text x="620" y="308" class="c4-type" fill="#ffffff" font-style="italic" font-size="11" text-anchor="middle">&lt;&lt;container&gt;&gt;</text>
      <text x="620" y="324" class="c4-label" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Single-Page App</text>
      <text x="620" y="340" class="c4-technology" font-style="italic" text-anchor="middle" fill="#ffffff" font-size="11">[JavaScript, Angular]</text>
      <text x="620" y="360" class="c4-description" text-anchor="middle" font-size="11" fill="#ffffff">Provides all the Internet banking functionality</text>
    </g>
    <g class="c4-element-group" id="api">
      <rect x="748" y="290" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" fill="#438dd5" stroke="#3879b8" stroke-width="0.5"/>
      <text x="856" y="308" class="c4-type" font-size="11" text-anchor="middle" fill="#ffffff" font-style="italic">&lt;&lt;container&gt;&gt;</text>
      <text x="856" y="324" class="c4-label" font-weight="bold" text-anchor="middle" font-size="14" fill="#ffffff">API Application</text>
      <text x="856" y="340" class="c4-technology" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">[Java, Spring MVC]</text>
      <text x="856" y="360" class="c4-description" text-anchor="middle" fill="#ffffff" font-size="11">Provides banking functionality via JSON/HTTPS API</text>
    </g>
    <g class="c4-element-group" id="db">
      <path d="M984,290c0,-10 108,-10 108,-10c0,0 108,0 108,10l0,150c0,10 -108,-10 -108,-10c0,0 -108,0 -108,-10l0,-150" class="c4-db" stroke-width="0.5" stroke="#3879b8" fill="#438dd5"/>
      <path d="M984,290c0,10 108,10 108,10c0,0 108,0 108,-10" class="c4-db-top" fill="none" stroke="#3879b8" stroke-width="0.5"/>
      <text x="1092" y="308" class="c4-type" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">&lt;&lt;container_db&gt;&gt;</text>
      <text x="1092" y="324" class="c4-label" fill="#ffffff" text-anchor="middle" font-size="14" font-weight="bold">Database</text>
      <text x="1092" y="340" class="c4-technology" font-size="11" font-style="italic" fill="#ffffff" text-anchor="middle">[Oracle]</text>
      <text x="1092" y="360" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">Stores user data, accounts, transactions</text>
    </g>
    <g class="c4-element-group" id="queue">
      <path d="M1220,290l216,0c5,0 5,75 5,75c0,0 0,75 -5,75l-216,0c-5,0 -5,-75 -5,-75c0,0 0,-75 5,-75" class="c4-queue" stroke-width="0.5" stroke="#3879b8" fill="#438dd5"/>
      <path d="M1436,290c-5,0 -5,75 -5,75c0,75 5,75 5,75" class="c4-queue-right" stroke-width="0.5" fill="none" stroke="#3879b8"/>
      <text x="1328" y="308" class="c4-type" text-anchor="middle" font-size="11" font-style="italic" fill="#ffffff">&lt;&lt;container_queue&gt;&gt;</text>
      <text x="1328" y="324" class="c4-label" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Message Broker</text>
      <text x="1328" y="340" class="c4-technology" fill="#ffffff" font-style="italic" text-anchor="middle" font-size="11">[RabbitMQ]</text>
      <text x="1328" y="360" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">Handles async messaging</text>
    </g>
    <g class="c4-relationship-group">
      <line x1="454.3529411764706" y1="200" x2="544.7058823529412" y2="290" class="c4-relationship" stroke="#666666" marker-end="url(#c4-arrow)" stroke-width="1"/>
      <text x="499.5294117647059" y="249" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="12">Uses</text>
      <text x="499.5294117647059" y="262" class="c4-rel-technology" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">[HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M728,365 Q733,365 748,365" class="c4-relationship" stroke="#666666" fill="none" marker-end="url(#c4-arrow)" stroke-width="1"/>
      <text x="738" y="369" class="c4-rel-label" font-size="12" text-anchor="middle" fill="#666666">Makes API calls to</text>
      <text x="738" y="382" class="c4-rel-technology" font-size="12" fill="#666666" font-style="italic" text-anchor="middle">[JSON/HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M964,365 Q969,365 984,365" class="c4-relationship" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#c4-arrow)"/>
      <text x="974" y="369" class="c4-rel-label" text-anchor="middle" font-size="12" fill="#666666">Reads from and writes to</text>
      <text x="974" y="382" class="c4-rel-technology" fill="#666666" font-size="12" text-anchor="middle" font-style="italic">[JDBC]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M964,365 Q1028,365 1220,365" class="c4-relationship" stroke="#666666" fill="none" marker-end="url(#c4-arrow)" stroke-width="1"/>
      <text x="1092" y="369" class="c4-rel-label" text-anchor="middle" fill="#666666" font-size="12">Sends messages to</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M236,101.86440677966101 Q241,102.5 256,103.13559322033899" class="c4-relationship" stroke="#666666" fill="none" stroke-width="1" marker-end="url(#c4-arrow)"/>
      <text x="246" y="106.5" class="c4-rel-label" font-size="12" fill="#666666" text-anchor="middle">Sends e-mails to</text>
    </g>
  </g>
</svg>
