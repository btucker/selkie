<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1496" height="500" viewBox="0 0 1496 500" class="mermaid">
  <style>

.c4-element-group {
  cursor: pointer;
}

.c4-element, .c4-person-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-person-head {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-db-top, .c4-db-body, .c4-db-bottom {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-queue {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-boundary {
  fill: none;
}

.c4-label, .c4-technology, .c4-description {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-boundary-label {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-rel-label, .c4-rel-technology {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-relationship {
  stroke-linecap: round;
}

  </style>
  <defs>
    <marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
</marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <g class="c4-boundary-group" id="c1">
      <rect x="492" y="240" width="964" height="220" rx="2.5" ry="2.5" class="c4-boundary" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="7,7"/>
      <text x="502" y="260" class="c4-boundary-label" font-weight="bold" fill="#444444" font-size="14">Internet Banking</text>
    </g>
    <g class="c4-element-group" id="email_system">
      <rect x="20" y="20" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" stroke-width="0.5" fill="#999999" stroke="#7a7a7a"/>
      <text x="128" y="38" class="c4-type" font-size="11" font-style="italic" fill="#ffffff" text-anchor="middle">&lt;&lt;external_system&gt;&gt;</text>
      <text x="128" y="54" class="c4-label" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">E-Mail System</text>
      <text x="128" y="76" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">The internal Microsoft</text>
      <text x="128" y="90" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">Exchange system</text>
    </g>
    <g class="c4-element-group" id="customer">
      <rect x="256" y="20" width="216" height="180" rx="2.5" ry="2.5" class="c4-element" stroke="#073b6f" stroke-width="0.5" fill="#08427b"/>
      <text x="364" y="38" class="c4-type" font-style="italic" fill="#ffffff" text-anchor="middle" font-size="11">&lt;&lt;person&gt;&gt;</text>
      <circle cx="364" cy="70" r="10" class="c4-person-icon-head" fill="#ffffff"/>
      <path d="M364,80 l-15,25 l30,0 z" class="c4-person-icon-body" fill="#ffffff"/>
      <text x="364" y="104" class="c4-label" fill="#ffffff" text-anchor="middle" font-weight="bold" font-size="14">Customer</text>
      <text x="364" y="126" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">A customer of the bank, with</text>
      <text x="364" y="140" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">personal bank accounts</text>
    </g>
    <g class="c4-element-group" id="spa">
      <rect x="512" y="290" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" stroke-width="0.5" stroke="#3879b8" fill="#438dd5"/>
      <text x="620" y="308" class="c4-type" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">&lt;&lt;container&gt;&gt;</text>
      <text x="620" y="324" class="c4-label" fill="#ffffff" font-weight="bold" text-anchor="middle" font-size="14">Single-Page App</text>
      <text x="620" y="340" class="c4-technology" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">[JavaScript, Angular]</text>
      <text x="620" y="360" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">Provides all the Internet</text>
      <text x="620" y="374" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">banking functionality</text>
    </g>
    <g class="c4-element-group" id="api">
      <rect x="748" y="290" width="216" height="150" rx="2.5" ry="2.5" class="c4-element" stroke-width="0.5" stroke="#3879b8" fill="#438dd5"/>
      <text x="856" y="308" class="c4-type" fill="#ffffff" font-size="11" text-anchor="middle" font-style="italic">&lt;&lt;container&gt;&gt;</text>
      <text x="856" y="324" class="c4-label" text-anchor="middle" font-weight="bold" font-size="14" fill="#ffffff">API Application</text>
      <text x="856" y="340" class="c4-technology" text-anchor="middle" font-style="italic" font-size="11" fill="#ffffff">[Java, Spring MVC]</text>
      <text x="856" y="360" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">Provides banking</text>
      <text x="856" y="374" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">functionality via JSON/HTTPS</text>
      <text x="856" y="388" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">API</text>
    </g>
    <g class="c4-element-group" id="db">
      <path d="M984,290c0,-10 108,-10 108,-10c0,0 108,0 108,10l0,150c0,10 -108,-10 -108,-10c0,0 -108,0 -108,-10l0,-150" class="c4-db" stroke-width="0.5" fill="#438dd5" stroke="#3879b8"/>
      <path d="M984,290c0,10 108,10 108,10c0,0 108,0 108,-10" class="c4-db-top" fill="none" stroke-width="0.5" stroke="#3879b8"/>
      <text x="1092" y="308" class="c4-type" text-anchor="middle" font-style="italic" fill="#ffffff" font-size="11">&lt;&lt;container_db&gt;&gt;</text>
      <text x="1092" y="324" class="c4-label" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">Database</text>
      <text x="1092" y="340" class="c4-technology" text-anchor="middle" font-size="11" font-style="italic" fill="#ffffff">[Oracle]</text>
      <text x="1092" y="360" class="c4-description" text-anchor="middle" font-size="11" fill="#ffffff">Stores user data, accounts,</text>
      <text x="1092" y="374" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">transactions</text>
    </g>
    <g class="c4-element-group" id="queue">
      <path d="M1220,290l216,0c5,0 5,75 5,75c0,0 0,75 -5,75l-216,0c-5,0 -5,-75 -5,-75c0,0 0,-75 5,-75" class="c4-queue" fill="#438dd5" stroke-width="0.5" stroke="#3879b8"/>
      <path d="M1436,290c-5,0 -5,75 -5,75c0,75 5,75 5,75" class="c4-queue-right" stroke-width="0.5" stroke="#3879b8" fill="none"/>
      <text x="1328" y="308" class="c4-type" text-anchor="middle" font-style="italic" fill="#ffffff" font-size="11">&lt;&lt;container_queue&gt;&gt;</text>
      <text x="1328" y="324" class="c4-label" fill="#ffffff" text-anchor="middle" font-size="14" font-weight="bold">Message Broker</text>
      <text x="1328" y="340" class="c4-technology" font-size="11" fill="#ffffff" text-anchor="middle" font-style="italic">[RabbitMQ]</text>
      <text x="1328" y="360" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">Handles async messaging</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 454.3529411764706 200 L 544.7058823529412 290" class="c4-relationship" fill="none" stroke-width="1" marker-end="url(#c4-arrow)" stroke="#666666"/>
      <rect x="480.5294117647059" y="235" width="38" height="20" rx="3" ry="3" class="c4-rel-label-bg" fill="#ffffff" stroke="#666666" stroke-width="0.5"/>
      <text x="499.5294117647059" y="249" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="11">Uses</text>
      <text x="499.5294117647059" y="260" class="c4-rel-technology" text-anchor="middle" font-size="10" fill="#666666" font-style="italic">[HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 728 365 L 748 365" class="c4-relationship" stroke="#666666" marker-end="url(#c4-arrow)" fill="none" stroke-width="1"/>
      <rect x="670" y="355" width="136" height="20" rx="3" ry="3" class="c4-rel-label-bg" fill="#ffffff" stroke="#666666" stroke-width="0.5"/>
      <text x="738" y="369" class="c4-rel-label" font-size="11" text-anchor="middle" fill="#666666">Makes API calls to</text>
      <text x="738" y="380" class="c4-rel-technology" font-style="italic" font-size="10" text-anchor="middle" fill="#666666">[JSON/HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 964 365 L 984 365" class="c4-relationship" stroke-width="1" marker-end="url(#c4-arrow)" fill="none" stroke="#666666"/>
      <rect x="899" y="355" width="150" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke-width="0.5" stroke="#666666" fill="#ffffff"/>
      <text x="974" y="369" class="c4-rel-label" text-anchor="middle" font-size="11" fill="#666666">Reads from and writes to</text>
      <text x="974" y="380" class="c4-rel-technology" font-style="italic" font-size="10" fill="#666666" text-anchor="middle">[JDBC]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 964 365 L 1220 365" class="c4-relationship" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#c4-arrow)"/>
      <rect x="1027.5" y="355" width="129" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke-width="0.5" fill="#ffffff" stroke="#666666"/>
      <text x="1092" y="369" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="11">Sends messages to</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 236 101.86440677966101 L 256 103.13559322033899" class="c4-relationship" marker-end="url(#c4-arrow)" fill="none" stroke="#666666" stroke-width="1"/>
      <rect x="185" y="92.5" width="122" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke="#666666" fill="#ffffff" stroke-width="0.5"/>
      <text x="246" y="106.5" class="c4-rel-label" fill="#666666" font-size="11" text-anchor="middle">Sends e-mails to</text>
    </g>
  </g>
</svg>
