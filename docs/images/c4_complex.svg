<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="630" viewBox="0 0 1110 630" class="mermaid">
  <style>

.c4-element-group {
  cursor: pointer;
}

.c4-element, .c4-person-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-person-head {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-db-top, .c4-db-body {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-queue {
  stroke: rgba(0,0,0,0.3);
  stroke-width: 1px;
}

.c4-boundary {
  fill: none;
}

.c4-label, .c4-technology, .c4-description {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-boundary-label {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-rel-label, .c4-rel-technology {
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.c4-relationship {
  stroke-linecap: round;
}

  </style>
  <defs>
    <marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
</marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <g class="c4-boundary-group" id="c1">
      <rect x="40" y="260" width="990" height="250" rx="5" ry="5" class="c4-boundary" fill="none" stroke-width="2" stroke="#444444" stroke-dasharray="10,5"/>
      <text x="50" y="280" class="c4-boundary-label" font-weight="bold" fill="#444444" font-size="14">Internet Banking</text>
    </g>
    <g class="c4-element-group" id="email_system">
      <rect x="40" y="80" width="200" height="120" rx="5" ry="5" class="c4-element" fill="#999999"/>
      <text x="140" y="115" class="c4-label" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">E-Mail System</text>
      <text x="140" y="140" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">The internal Microsoft</text>
      <text x="140" y="154" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">Exchange system</text>
    </g>
    <g class="c4-element-group" id="customer">
      <circle cx="380" cy="110" r="25" class="c4-person-head" fill="#08427b"/>
      <rect x="280" y="140" width="200" height="80" rx="5" ry="5" class="c4-person-body" fill="#08427b"/>
      <text x="380" y="115" class="c4-label" font-weight="bold" fill="#ffffff" text-anchor="middle" font-size="14">Customer</text>
      <text x="380" y="140" class="c4-description" fill="#ffffff" text-anchor="middle" font-size="11">A customer of the bank, with</text>
      <text x="380" y="154" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">personal bank accounts</text>
    </g>
    <g class="c4-element-group" id="spa">
      <rect x="70" y="300" width="200" height="120" rx="5" ry="5" class="c4-element" fill="#438dd5"/>
      <text x="170" y="335" class="c4-label" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Single-Page App</text>
      <text x="170" y="353" class="c4-technology" font-size="11" text-anchor="middle" fill="#ffffff">[JavaScript, Angular]</text>
      <text x="170" y="375" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">Provides all the Internet</text>
      <text x="170" y="389" class="c4-description" text-anchor="middle" font-size="11" fill="#ffffff">banking functionality</text>
    </g>
    <g class="c4-element-group" id="api">
      <rect x="310" y="300" width="200" height="120" rx="5" ry="5" class="c4-element" fill="#438dd5"/>
      <text x="410" y="335" class="c4-label" fill="#ffffff" text-anchor="middle" font-size="14" font-weight="bold">API Application</text>
      <text x="410" y="353" class="c4-technology" text-anchor="middle" fill="#ffffff" font-size="11">[Java, Spring MVC]</text>
      <text x="410" y="375" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">Provides banking functionality</text>
      <text x="410" y="389" class="c4-description" font-size="11" fill="#ffffff" text-anchor="middle">via JSON/HTTPS API</text>
    </g>
    <g class="c4-element-group" id="db">
      <ellipse cx="650" cy="315" rx="100" ry="15" class="c4-db-top" fill="#438dd5"/>
      <rect x="550" y="315" width="200" height="90" class="c4-db-body" fill="#438dd5"/>
      <path d="M 550 405 A 100 15 0 0 0 750 405 L 750 405 A 100 15 0 0 0 550 405 Z" class="c4-db-bottom" fill="#438dd5"/>
      <text x="650" y="335" class="c4-label" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Database</text>
      <text x="650" y="353" class="c4-technology" font-size="11" text-anchor="middle" fill="#ffffff">[Oracle]</text>
      <text x="650" y="375" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">Stores user data, accounts,</text>
      <text x="650" y="389" class="c4-description" fill="#ffffff" font-size="11" text-anchor="middle">transactions</text>
    </g>
    <g class="c4-element-group" id="queue">
      <rect x="790" y="300" width="200" height="120" rx="60" ry="60" class="c4-queue" fill="#438dd5"/>
      <text x="890" y="335" class="c4-label" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="14">Message Broker</text>
      <text x="890" y="353" class="c4-technology" text-anchor="middle" fill="#ffffff" font-size="11">[RabbitMQ]</text>
      <text x="890" y="375" class="c4-description" font-size="11" text-anchor="middle" fill="#ffffff">Handles async messaging</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 380 220 L 170 300" class="c4-relationship" stroke="#666666" fill="none" stroke-width="1.5" marker-end="url(#c4-arrow)"/>
      <rect x="256" y="250" width="38" height="20" rx="3" ry="3" class="c4-rel-label-bg" fill="#ffffff" stroke-width="1" stroke="#666666"/>
      <text x="275" y="264" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="11">Uses</text>
      <text x="275" y="275" class="c4-rel-technology" text-anchor="middle" fill="#666666" font-size="10">[HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 270 360 L 310 360" class="c4-relationship" marker-end="url(#c4-arrow)" stroke-width="1.5" stroke="#666666" fill="none"/>
      <rect x="222" y="350" width="136" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke="#666666" stroke-width="1" fill="#ffffff"/>
      <text x="290" y="364" class="c4-rel-label" font-size="11" fill="#666666" text-anchor="middle">Makes API calls to</text>
      <text x="290" y="375" class="c4-rel-technology" text-anchor="middle" fill="#666666" font-size="10">[JSON/HTTPS]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 510 360 L 550 360" class="c4-relationship" stroke-width="1.5" stroke="#666666" fill="none" marker-end="url(#c4-arrow)"/>
      <rect x="441" y="350" width="178" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke-width="1" fill="#ffffff" stroke="#666666"/>
      <text x="530" y="364" class="c4-rel-label" font-size="11" fill="#666666" text-anchor="middle">Reads from and writes to</text>
      <text x="530" y="375" class="c4-rel-technology" fill="#666666" text-anchor="middle" font-size="10">[JDBC]</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 510 360 L 790 360" class="c4-relationship" fill="none" stroke="#666666" marker-end="url(#c4-arrow)" stroke-width="1.5"/>
      <rect x="585.5" y="350" width="129" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke-width="1" fill="#ffffff" stroke="#666666"/>
      <text x="650" y="364" class="c4-rel-label" fill="#666666" text-anchor="middle" font-size="11">Sends messages to</text>
    </g>
    <g class="c4-relationship-group">
      <path d="M 240 140 L 280 150" class="c4-relationship" stroke="#666666" fill="none" marker-end="url(#c4-arrow)" stroke-width="1.5"/>
      <rect x="199" y="135" width="122" height="20" rx="3" ry="3" class="c4-rel-label-bg" stroke="#666666" stroke-width="1" fill="#ffffff"/>
      <text x="260" y="149" class="c4-rel-label" text-anchor="middle" font-size="11" fill="#666666">Sends e-mails to</text>
    </g>
  </g>
</svg>
