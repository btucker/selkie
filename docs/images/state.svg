<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="145.5" height="438" viewBox="0 0 145.5 438" class="mermaid">
  <style>

.mermaid {
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.node rect,
.node polygon,
.node circle,
.node ellipse,
.node path {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1px;
}

.node line {
  stroke: #9370DB;
  stroke-width: 1px;
}

.node .label {
  fill: #333333;
}

.node text {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.edge-path {
  fill: none;
  stroke: #333333;
  stroke-width: 1px;
}

.edge-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.edge-label-bg {
  fill: rgba(232, 232, 232, 0.8);
}

.subgraph {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
}

.subgraph-title {
  fill: #333333;
  font-weight: bold;
}

.cluster rect {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
  rx: 5px;
  ry: 5px;
}

.cluster-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
}

marker path {
  fill: #333333;
  stroke: #333333;
}


.state-title {
  fill: #333333;
}

.state-box {
  fill: #ECECFF;
  stroke: #333333;
}

.state-label {
  fill: #333333;
  font-weight: bold;
}

.state-description {
  fill: #666666;
}

.state-start {
  fill: #333333;
}

.state-end-outer {
  fill: #9370DB;
  stroke: white;
  stroke-width: 1.5;
}

.state-end-inner {
  fill: white;
}

.state-fork-join {
  fill: #333333;
}

.state-choice {
  fill: #ECECFF;
  stroke: #333333;
}

.state-divider {
  stroke: #333333;
  stroke-dasharray: 5, 5;
}

.transition-path {
  stroke: #333333;
  fill: none;
}

.transition-label {
  fill: #333333;
}

.transition-label-bg {
  fill: rgba(232, 232, 232, 0.8);
  stroke: none;
}

.note-box {
  fill: #FFFFCC;
  stroke: #333333;
}

.note-text {
  fill: #333333;
}

.state-composite-outer {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1px;
}

.state-composite-inner {
  fill: white;
  stroke: none;
}

.state-composite-label {
  fill: #333333;
  font-weight: bold;
}

  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 20 14" refX="19" refY="7" markerWidth="20" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 19,7 L9,13 L14,7 L9,1 Z" stroke="#333333" stroke-width="1" fill="#333333"/>
    </marker>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <g class="state-node" id="state-Error">
      <rect x="55.5" y="294" width="50" height="30" rx="10" ry="10" class="state-box" stroke="#333333" fill="#ECECFF" stroke-width="1"/>
      <text x="80.5" y="314" class="state-label" text-anchor="middle" font-size="10">Error</text>
    </g>
    <g class="state-node" id="state-Idle">
      <rect x="35.5" y="74" width="44" height="30" rx="10" ry="10" class="state-box" stroke-width="1" fill="#ECECFF" stroke="#333333"/>
      <text x="57.5" y="94" class="state-label" font-size="10" text-anchor="middle">Idle</text>
    </g>
    <g class="state-node" id="state-Running">
      <rect x="0" y="184" width="62" height="30" rx="10" ry="10" class="state-box" stroke-width="1" fill="#ECECFF" stroke="#333333"/>
      <text x="31" y="204" class="state-label" font-size="10" text-anchor="middle">Running</text>
    </g>
    <g class="state-node" id="state-[*]_end_0">
      <circle cx="80.5" cy="391" r="7" class="state-end-outer" fill="#9370DB" stroke-width="1.5" stroke="white"/>
      <circle cx="80.5" cy="391" r="3.5" class="state-end-inner" fill="white"/>
    </g>
    <g class="state-node" id="state-[*]_start_0">
      <circle cx="57.5" cy="7" r="7" class="state-start" fill="#333333"/>
    </g>
    <g class="transition">
      <path d="M 57.50 14.00 C 57.50 24.00, 57.50 34.00, 57.50 44.00 C 57.50 54.00, 57.50 64.00, 57.50 74.00" class="transition-path" stroke="#333333" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
    </g>
    <g class="transition">
      <path d="M 57.50 104.00 C 57.50 117.33, 57.50 130.67, 54.29 144.00 C 51.08 157.33, 44.65 170.67, 38.23 184.00" class="transition-path" marker-end="url(#arrow)" fill="none" stroke="#333333" stroke-width="1"/>
      <rect x="37.25" y="108" width="40.5" height="18" rx="2" ry="2" class="transition-label-bg"/>
      <text x="57.5" y="119" class="transition-label" text-anchor="middle" font-size="11">start</text>
    </g>
    <g class="transition">
      <path d="M 31.00 184.00 C 35.42 170.67, 39.83 157.33, 44.25 144.00 C 48.67 130.67, 53.08 117.33, 57.50 104.00" class="transition-path" stroke="#333333" marker-end="url(#arrow)" stroke-width="1" fill="none"/>
      <rect x="27.25" y="128" width="34" height="18" rx="2" ry="2" class="transition-label-bg"/>
      <text x="44.25" y="139" class="transition-label" font-size="11" text-anchor="middle">stop</text>
    </g>
    <g class="transition">
      <path d="M 31.00 214.00 C 31.00 227.33, 31.00 240.67, 37.00 254.00 C 43.00 267.33, 55.00 280.67, 67.00 294.00" class="transition-path" marker-end="url(#arrow)" stroke="#333333" stroke-width="1" fill="none"/>
      <rect x="10.75" y="218" width="40.5" height="18" rx="2" ry="2" class="transition-label-bg"/>
      <text x="31" y="229" class="transition-label" font-size="11" text-anchor="middle">error</text>
    </g>
    <g class="transition">
      <path d="M 94.95 294.00 C 107.80 280.67, 120.65 267.33, 127.08 251.50 C 133.50 235.67, 133.50 217.33, 133.50 199.00 C 133.50 180.67, 133.50 162.33, 124.29 146.50 C 96.65 117.33, 78.23 104.00, 78.23 104.00" class="transition-path" stroke-width="1" fill="none" marker-end="url(#arrow)" stroke="#333333"/>
      <rect x="113.25" y="210.5" width="40.5" height="18" rx="2" ry="2" class="transition-label-bg"/>
      <text x="133.5" y="221.5" class="transition-label" font-size="11" text-anchor="middle">reset</text>
    </g>
    <g class="transition">
      <path d="M 80.50 324.00 C 80.50 334.00, 80.50 344.00, 80.50 354.00 C 80.50 364.00, 80.50 374.00, 80.50 384.00" class="transition-path" fill="none" stroke-width="1" stroke="#333333" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>
