.orange rect { fill:#f96 !important; stroke:#333 !important; stroke-width:4px !important; }
.orange polygon { fill:#f96 !important; stroke:#333 !important; stroke-width:4px !important; }
.orange ellipse { fill:#f96 !important; stroke:#333 !important; stroke-width:4px !important; }
.orange circle { fill:#f96 !important; stroke:#333 !important; stroke-width:4px !important; }
.orange path { fill:#f96 !important; stroke:#333 !important; stroke-width:4px !important; }
