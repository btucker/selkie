      <g>
        <text x="110" y="6.099999999999998" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em"><tspan x="110" dy="0em">People arrive from</tspan><tspan x="110" dy="1.1em">Europe and settle</tspan><tspan x="110" dy="1.1em">in Britain.</tspan></text>
