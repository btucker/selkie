<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" class="mermaid">
  <style>

.mermaid {
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.node rect,
.node polygon,
.node circle,
.node ellipse,
.node path {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1px;
}

.node line {
  stroke: #9370DB;
  stroke-width: 1px;
}

.node .label {
  fill: #333333;
}

.node text {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.edge-path {
  fill: none;
  stroke: #333333;
  stroke-width: 1px;
}

.edge-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.edge-label-bg {
  fill: rgba(232, 232, 232, 0.8);
}

.subgraph {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
}

.subgraph-title {
  fill: #333333;
  font-weight: bold;
}

.cluster rect {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
  rx: 5px;
  ry: 5px;
}

.cluster-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
}

marker path {
  fill: #333333;
  stroke: #333333;
}


.sankey-node {
  stroke: none;
}

.sankey-link {
  fill-opacity: 0.5;
}

.sankey-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.link {
  mix-blend-mode: multiply;
}

  </style>
  <defs>
    <defs>
      <linearGradient id="linearGradient-1" gradientUnits="userSpaceOnUse" x1="10" x2="295"><stop offset="0%" stop-color="#4e79a7"/><stop offset="100%" stop-color="#f28e2c"/></linearGradient>
      <linearGradient id="linearGradient-2" gradientUnits="userSpaceOnUse" x1="305" x2="590"><stop offset="0%" stop-color="#f28e2c"/><stop offset="100%" stop-color="#e15759"/></linearGradient>
    </defs>
  </defs>
  <g class="root">
    <g class="clusters">

    </g>
    <g class="edgePaths">

    </g>
    <g class="edgeLabels">

    </g>
    <g class="nodes">

    </g>
    <g class="links">
      <g class="link" style="mix-blend-mode: multiply">
        <path d="M10,0 C152.5,0 152.5,0 295,0 L295,400 C152.5,400 152.5,400 10,400 Z" class="sankey-link" fill="url(#linearGradient-1)" fill-opacity="0.5"/>
      </g>
      <g class="link" style="mix-blend-mode: multiply">
        <path d="M305,0 C447.5,0 447.5,0 590,0 L590,400 C447.5,400 447.5,400 305,400 Z" class="sankey-link" fill-opacity="0.5" fill="url(#linearGradient-2)"/>
      </g>
    </g>
    <g class="nodes">
      <g class="node" transform="translate(0,0)" x="0" y="0" id="node-1">
        <rect x="0" y="0" width="10" height="400" class="sankey-node" fill="#4e79a7"/>
      </g>
      <g class="node" x="295" id="node-2" y="0" transform="translate(295,0)">
        <rect x="295" y="0" width="10" height="400" class="sankey-node" fill="#f28e2c"/>
      </g>
      <g class="node" transform="translate(590,0)" y="0" x="590" id="node-3">
        <rect x="590" y="0" width="10" height="400" class="sankey-node" fill="#e15759"/>
      </g>
    </g>
    <g class="node-labels" font-size="14">
      <text x="16" y="200" class="sankey-label" font-size="14" dominant-baseline="middle" text-anchor="start" fill="#333333">a</text>
      <text x="289" y="200" class="sankey-label" text-anchor="end" font-size="14" dominant-baseline="middle" fill="#333333">b</text>
      <text x="584" y="200" class="sankey-label" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">c</text>
    </g>
  </g>
</svg>
