.mermaid{font-family:trebuchet ms, verdana, arial, sans-serif;font-size:16px;fill:#333333;}
.error-icon{fill:#552222;}
.error-text{fill:#552222;stroke:#552222;}
.edge-thickness-normal{stroke-width:1px;}
.edge-thickness-thick{stroke-width:3.5px;}
.edge-pattern-solid{stroke-dasharray:0;}
.edge-thickness-invisible{stroke-width:0;fill:none;}
.edge-pattern-dashed{stroke-dasharray:3;}
.edge-pattern-dotted{stroke-dasharray:2;}
.marker{fill:#333333;stroke:#333333;}
.marker.cross{stroke:#333333;}
svg{font-family:trebuchet ms, verdana, arial, sans-serif;font-size:16px;}
p{margin:0;}
.label{font-family:trebuchet ms, verdana, arial, sans-serif;color:#333333;}
.cluster-label text{fill:#333333;}
.cluster-label span{color:#333333;}
.cluster-label span p{background-color:transparent;}
.label text,span{fill:#333333;color:#333333;}
.node rect,.node circle,.node ellipse,.node polygon,.node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}
.rough-node .label text,.node .label text,.image-shape .label,.icon-shape .label{text-anchor:middle;}
.node .katex path{fill:#000;stroke:#000;stroke-width:1px;}
.rough-node .label,.node .label,.image-shape .label,.icon-shape .label{text-align:center;}
.node.clickable{cursor:pointer;}
.root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}
.arrowheadPath{fill:#333333;}
.edgePath .path{stroke:#333333;stroke-width:2.0px;}
.flowchart-link{stroke:#333333;fill:none;}
.edgeLabel{background-color:rgba(232, 232, 232, 0.8);text-align:center;}
.edgeLabel p{background-color:rgba(232, 232, 232, 0.8);}
.edgeLabel rect{opacity:0.5;background-color:rgba(232, 232, 232, 0.8);fill:rgba(232, 232, 232, 0.8);}
.labelBkg{background-color:rgba(232, 232, 232, 0.5);}
.cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}
.cluster text{fill:#333333;}
.cluster span{color:#333333;}
.flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333333;}
rect.text{fill:none;stroke-width:0;}

