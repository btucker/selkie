    <g class="timeline-node section-0" transform="translate(50, 50)">
      <path d="M0 45 v-40 q0,-5 5,-5 h540 q5,0 5,5 v45 H0 Z" class="node-bkg node-section-0"/>
      <line x1="0" y1="50" x2="550" y2="50" class="node-line-0"/>
      <text x="275" y="25" dominant-baseline="middle" alignment-baseline="middle" dy="1em" text-anchor="middle">17th-20th century</text>
    </g>
    <g class="taskWrapper timeline-node section-0" transform="translate(50, 150)">
