      <line x1="0" y1="50" x2="190" y2="50" class="node-line-1"/>
      <g>
        <text x="95" y="12.899999999999999" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em"><tspan x="95" dy="0em">Internet, Robotics,</tspan><tspan x="95" dy="1.1em">Internet of Things</tspan></text>
      </g>
    </g>
    <g class="taskWrapper timeline-node section-1" transform="translate(850, 150)">
      <path d="M0 45 v-40 q0,-5 5,-5 h180 q5,0 5,5 v45 H0 Z" class="node-bkg node-section-1"/>
      <line x1="0" y1="50" x2="190" y2="50" class="node-line-1"/>
      <text x="95" y="25" dy="1em" text-anchor="middle" alignment-baseline="middle" dominant-baseline="middle">Industry 5.0</text>
