.cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}
.cluster text{fill:#333333;}
.cluster span{color:#333333;}
.flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333333;}
rect.text{fill:none;stroke-width:0;}

