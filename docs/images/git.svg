<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="413.2" height="186" viewBox="-135.2 -48 413.2 186" class="mermaid">
  <style>

.mermaid {
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.node rect,
.node polygon,
.node circle,
.node ellipse,
.node path {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1px;
}

.node line {
  stroke: #9370DB;
  stroke-width: 1px;
}

.node .label {
  fill: #333333;
}

.node text {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
}

.edge-path {
  fill: none;
  stroke: #333333;
  stroke-width: 1px;
}

.edge-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
}

.edge-label-bg {
  fill: rgba(232, 232, 232, 0.8);
}

.subgraph {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
}

.subgraph-title {
  fill: #333333;
  font-weight: bold;
}

.cluster rect {
  fill: #ffffde;
  stroke: #aaaa33;
  stroke-width: 1px;
  rx: 5px;
  ry: 5px;
}

.cluster-label {
  fill: #333333;
  font-family: trebuchet ms, verdana, arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
}

marker path {
  fill: #333333;
  stroke: #333333;
}

  .commit-id,
  .commit-msg,
  .branch-label {
    fill: lightgrey;
    color: lightgrey;
    font-family: var(--mermaid-font-family);
  }

        .branch-label0 { fill: #cccccc; }
        .commit0 { stroke: #6d6dff; fill: #6d6dff; }
        .commit-highlight0 { stroke: #121200; fill: #121200; }
        .label0  { fill: #6d6dff; }
        .arrow0 { stroke: #6d6dff; }

        .branch-label1 { fill: #333333; }
        .commit1 { stroke: #ffff5f; fill: #ffff5f; }
        .commit-highlight1 { stroke: #0000a0; fill: #0000a0; }
        .label1  { fill: #ffff5f; }
        .arrow1 { stroke: #ffff5f; }

        .branch-label2 { fill: #333333; }
        .commit2 { stroke: #bababa; fill: #bababa; }
        .commit-highlight2 { stroke: #454545; fill: #454545; }
        .label2  { fill: #bababa; }
        .arrow2 { stroke: #bababa; }

        .branch-label3 { fill: #cccccc; }
        .commit3 { stroke: #6dbaff; fill: #6dbaff; }
        .commit-highlight3 { stroke: #924500; fill: #924500; }
        .label3  { fill: #6dbaff; }
        .arrow3 { stroke: #6dbaff; }

        .branch-label4 { fill: #333333; }
        .commit4 { stroke: #6dffff; fill: #6dffff; }
        .commit-highlight4 { stroke: #920000; fill: #920000; }
        .label4  { fill: #6dffff; }
        .arrow4 { stroke: #6dffff; }

        .branch-label5 { fill: #333333; }
        .commit5 { stroke: #6dffba; fill: #6dffba; }
        .commit-highlight5 { stroke: #920045; fill: #920045; }
        .label5  { fill: #6dffba; }
        .arrow5 { stroke: #6dffba; }

        .branch-label6 { fill: #333333; }
        .commit6 { stroke: #ff6dff; fill: #ff6dff; }
        .commit-highlight6 { stroke: #009200; fill: #009200; }
        .label6  { fill: #ff6dff; }
        .arrow6 { stroke: #ff6dff; }

        .branch-label7 { fill: #333333; }
        .commit7 { stroke: #ff6d6d; fill: #ff6d6d; }
        .commit-highlight7 { stroke: #009292; fill: #009292; }
        .label7  { fill: #ff6d6d; }
        .arrow7 { stroke: #ff6d6d; }

  .branch {
    stroke-width: 1;
    stroke: #333333;
    stroke-dasharray: 2;
  }
  .commit-label { font-size: 10px; fill: #333333; }
  .commit-label-bkg { font-size: 10px; fill: #ffffde; opacity: 0.5; }
  .tag-label { font-size: 10px; fill: #333333; }
  .tag-label-bkg { fill: #ECECFF; stroke: #9370DB; }
  .tag-hole { fill: #333333; }
  .commit-merge {
    stroke: #ECECFF;
    fill: #ECECFF;
  }
  .commit-reverse {
    stroke: #ECECFF;
    fill: #ECECFF;
    stroke-width: 3;
  }
  .commit-highlight-inner {
    stroke: #ECECFF;
    fill: #ECECFF;
  }
  .arrow { stroke-width: 8; stroke-linecap: round; fill: none }
  .gitTitleText {
    text-anchor: middle;
    font-size: 18px;
    fill: #333333;
  }

  </style>
