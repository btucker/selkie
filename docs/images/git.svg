        <text x="107" y="115" class="commit-label" transform="translate(-13.58, 12.04) rotate(-45, 110, 90)">C</text>
        <rect x="155" y="13.5" width="10" height="27" class="commit-label-bkg" transform="translate(-13.58, 12.04) rotate(-45, 160, 0)"/>
